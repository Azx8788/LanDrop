plugins {
    id 'com.android.application'
}

// 固定签名：CI 通过环境变量提供 keystore；本地没有这些变量时回退 debug 签名
def releaseKsPath = System.getenv("RELEASE_KEYSTORE_PATH")
def hasReleaseKs = releaseKsPath != null && new File(releaseKsPath).exists()

android {
    namespace 'com.example.landrop'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.landrop'
        minSdk 19          // Android 4.4
        targetSdk 28       // 兼容老系统，避免新版限制
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        if (hasReleaseKs) {
            release {
                storeFile file(releaseKsPath)
                storeType 'JKS'
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // 启用代码压缩和资源压缩，减小 APK 体积
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // CI 有固定签名时用固定签名，否则用 debug 签名（产出的 release APK 可直接安装）
            signingConfig(hasReleaseKs ? signingConfigs.release : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // targetSdk 28 是为老设备兼容的有意选择，不上架 Google Play，
        // 因此禁用「要求 targetSdk >= 33」的检查
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    // 零第三方依赖，最小化体积
}
